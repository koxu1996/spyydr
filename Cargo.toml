[package]
name = "spyydr"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "spyydr-cli"
path = "./src/bin/main.rs"

[dependencies]

# Asynchronous runtime.
tokio = { version = "1.47.1", default-features = false, features = ["rt-multi-thread", "macros"] }

# CLI.
clap = { version = "4.5.45", default-features = false, features = ["std", "derive", "help", "usage", "suggestions", "color"] }

# Error handling.
thiserror = { version = "2.0.16", default-features = false, features = ["std"] }
color-eyre = { version = "0.6.5", default-features = false, features = ["track-caller", "capture-spantrace"] }

# HTML parsing and querying.
scraper = { version = "0.24.0", default-features = false, features = [] }

# Logging.
tracing = { version = "0.1.41", default-features = false, features = [] }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["std", "env-filter", "ansi"] }

# REST client.
reqwest = { version = "0.12.23", default-features = false, features = ["native-tls"] }

# URL parsing.
url = { version = "2.5.6", default-features = false, features = [] }
