[package]
name = "spyydr"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "spyydr-cli"
path = "./src/bin/main.rs"

[dependencies]

# CLI.
clap = { version = "4.5.45", default-features = false, features = ["std", "derive", "help", "usage", "suggestions", "color"] }

# Error handling.
thiserror = { version = "2.0.16", default-features = false, features = ["std"] }
color-eyre = { version = "0.6.5", default-features = false, features = ["track-caller", "capture-spantrace"] }
